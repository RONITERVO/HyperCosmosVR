name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-build-and-unit-tests:
    name: Clippy & Hardware-Independent Tests (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Locate Visual Studio CMake (for static openxr-sys build)
        shell: pwsh
        run: |
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            $cand = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cand) {
              "CMAKE=$($cand.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              Write-Host "Using CMake at $($cand.FullName)"
            }
          }

      - name: Verify zero oversized or proprietary binaries tracked in Git
        shell: pwsh
        run: |
          $files = git ls-files
          $badFonts = $files | Where-Object { $_ -match '\.(ttf|otf)$' }
          if ($badFonts) {
            throw "Proprietary/local font binaries must not be tracked in Git:`n$($badFonts -join "`n")"
          }
          $big = $files | ForEach-Object {
            if (Test-Path $_) {
              $len = (Get-Item $_).Length
              if ($len -gt 52428800) { "${_} ($len bytes)" }
            }
          }
          if ($big) {
            throw "Tracked files exceed 50 MiB:`n$($big -join "`n")"
          }

      - name: Check workspace with clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run hardware-independent crate tests (math, narration, nav, journey)
        run: cargo test -p cosmos_math -p cosmos_narration -p cosmos_nav -p cosmos_journey

      - name: Validate WGSL and embedded Earth maps without GPU pipeline startup
        run: cargo test -p cosmos_render --lib

      - name: Run OpenXR stereo, hand, refresh & format unit tests (excluding registry runtime probe)
        run: cargo test -p cosmos_xr -- --skip openxr_static_entry_and_graceful_headset_probe

      - name: Run topology invariant tests (cosmos_spatial)
        run: cargo test -p cosmos_spatial topology

      - name: Run catalog schema, solver & CRC32 tests (cosmos_manifest, excluding 1.05 GiB audio pack test)
        run: cargo test -p cosmos_manifest --test manifest_tests -- --skip real_mmap_catalog_and_audio_pack_verify_all_18898_assets

      # Note: GPU render tests (`cosmos_render`, `cosmos_app` headless DX12 suite), OpenXR runtime registry probe,
      # proprietary font coverage tests, and full 18,898-MP3 mmap verification (`cosmos_audio`,
      # `real_mmap_catalog_and_audio_pack_verify_all_18898_assets`) require a Discrete DX12 GPU, an OpenXR runtime,
      # local OS/custom fonts, and the optional 1.05 GiB Release audio pack.
      # Run the full local suite with hardware-aware concurrency via: ./tools/test_local.ps1

