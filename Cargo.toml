[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Graphics, Windowing & OpenXR (Windows DX12 + DynamicDxc verified on RTX 5070)
wgpu = { version = "30.0.2", features = ["dx12", "vulkan", "wgsl"] }
wgpu-hal = { version = "30.0.2", features = ["dx12", "vulkan"] }
winit = "0.30.13"
openxr = { version = "0.22.0", features = ["static"] }
ash = { version = "0.38.0", default-features = false, features = ["loaded"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
windows-core = "0.62.2"

# Audio & DSP
symphonia = { version = "0.6.1", features = ["mp3", "opt-simd"] }
cpal = "0.18.2"
wsola = "0.3.0"
timestretch = { version = "0.16.0", default-features = false }
rubato = "5.1.0"
hrtf = "0.10.0"
fundsp = "0.23.0"

# 3D MSDF Text
fdsm = "0.8.0"
fdsm-ttf-parser = "0.2.0"
ttf-parser = "0.25.1"
nalgebra = "0.34.2"
ab_glyph = "0.2.32"
fontdue = "0.9.5"

# Math, Serialization, IO, Concurrency & Errors
glam = "0.34.3"
rayon = "1.12.0"
parking_lot = "0.13.0"
crossbeam-channel = "0.5.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
bytemuck = { version = "1.25.2", features = ["derive"] }
memmap2 = "0.9.12"
crc32fast = "1.5.5"
image = { version = "0.25.10", default-features = false, features = ["png"] }
pollster = "0.4.0"
anyhow = "1.0.104"
thiserror = "2.0.21"

